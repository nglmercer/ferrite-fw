<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ferrite Docs — Rust-native web toolchain</title>
    <meta
      name="description"
      content="Ferrite documentation: dev server, production builds, plugins, and deployment."
    />
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        var saved = window.localStorage.getItem("ferrite-docs-theme");
        if (
          saved === "dark" ||
          (saved !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        /* private mode: stay light */
      }
    </script>
  </head>
  <body class="theme-body antialiased">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="icon-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" />
        </symbol>
        <symbol id="icon-copy" viewBox="0 0 24 24">
          <rect x="9" y="9" width="13" height="13" rx="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </symbol>
        <symbol id="icon-check" viewBox="0 0 24 24">
          <path d="M20 6 9 17l-5-5" />
        </symbol>
        <symbol id="icon-burger" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18" />
        </symbol>
        <symbol id="icon-close" viewBox="0 0 24 24">
          <path d="M18 6 6 18M6 6l12 12" />
        </symbol>
      </defs>
    </svg>
    <div id="app" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
