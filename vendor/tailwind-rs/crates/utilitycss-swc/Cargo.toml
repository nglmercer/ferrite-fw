[package]
name = "utilitycss-swc"
description = "SWC AST-backed extraction for JavaScript, TypeScript, JSX, and TSX sources."
edition = "2021"
rust-version = "1.88"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nglmercer/tailwind-rs"
homepage = "https://github.com/nglmercer/tailwind-rs"

[dependencies]
swc_common = "=26.0.0"
swc_ecma_ast = "=29.0.0"
swc_ecma_parser = { version = "=45.0.1", default-features = false, features = ["typescript"] }
swc_ecma_visit = "=29.0.0"
utilitycss-scanner = { version = "0.1.0", path = "../utilitycss-scanner" }
utilitycss-span = { version = "0.1.0", path = "../utilitycss-span" }

[dev-dependencies]
proptest = "=1.11.0"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = "warn"
