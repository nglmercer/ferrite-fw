[package]
name = "utilitycss-config"
description = "Declarative JSON configuration loading for utilitycss hosts."
edition = "2021"
rust-version = "1.88"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nglmercer/tailwind-rs"
homepage = "https://github.com/nglmercer/tailwind-rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utilitycss-css-ir = { version = "0.1.0", path = "../utilitycss-css-ir" }
utilitycss-utilities = { version = "0.1.0", path = "../utilitycss-utilities" }
utilitycss-variants = { version = "0.1.0", path = "../utilitycss-variants" }
utilitycss-theme = { version = "0.1.0", path = "../utilitycss-theme" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = "warn"
