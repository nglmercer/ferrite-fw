[package]
name = "utilitycss-compat"
description = "Explicit compatibility profiles and conformance reporting for utilitycss."
edition = "2021"
rust-version = "1.88"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nglmercer/tailwind-rs"
homepage = "https://github.com/nglmercer/tailwind-rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utilitycss-compiler = { version = "0.1.0", path = "../utilitycss-compiler" }
utilitycss-config = { version = "0.1.0", path = "../utilitycss-config" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = "warn"
