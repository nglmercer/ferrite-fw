[package]
name = "utilitycss-stylesheet"
description = "CSS stylesheet parser and @apply-compatible transformer for utilitycss."
edition = "2021"
rust-version = "1.88"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nglmercer/tailwind-rs"
homepage = "https://github.com/nglmercer/tailwind-rs"

[dependencies]
cssparser = "0.37.0"
utilitycss-compiler = { version = "0.1.0", path = "../utilitycss-compiler" }
utilitycss-css-ir = { version = "0.1.0", path = "../utilitycss-css-ir" }
utilitycss-diagnostics = { version = "0.1.0", path = "../utilitycss-diagnostics" }
utilitycss-span = { version = "0.1.0", path = "../utilitycss-span" }
utilitycss-utilities = { version = "0.1.0", path = "../utilitycss-utilities" }

[dev-dependencies]
proptest = "=1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = "warn"
