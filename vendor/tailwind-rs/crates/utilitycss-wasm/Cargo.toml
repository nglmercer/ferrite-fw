[package]
name = "utilitycss-wasm"
description = "Thin WebAssembly binding for the utilitycss compiler facade."
edition = "2021"
rust-version = "1.88"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nglmercer/tailwind-rs"
homepage = "https://github.com/nglmercer/tailwind-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
utilitycss-compiler = { version = "0.1.0", path = "../utilitycss-compiler" }
utilitycss-config = { version = "0.1.0", path = "../utilitycss-config" }
utilitycss-css-ir = { version = "0.1.0", path = "../utilitycss-css-ir" }
utilitycss-diagnostics = { version = "0.1.0", path = "../utilitycss-diagnostics" }
utilitycss-extractor = { version = "0.1.0", path = "../utilitycss-extractor" }
utilitycss-scanner = { version = "0.1.0", path = "../utilitycss-scanner" }
utilitycss-stylesheet = { version = "0.1.0", path = "../utilitycss-stylesheet" }
utilitycss-span = { version = "0.1.0", path = "../utilitycss-span" }
utilitycss-swc = { version = "0.1.0", path = "../utilitycss-swc" }
wasm-bindgen = "0.2"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = "warn"
