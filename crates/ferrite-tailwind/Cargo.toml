[package]
name = "ferrite-tailwind"
version = "0.1.0"
edition = "2021"
description = "Ferrite plugin compiling utility CSS with vendored tailwind-rs"

[dependencies]
async-trait = { workspace = true }
ferrite-core = { workspace = true }
ferrite-plugin = { workspace = true }
ferrite-resolver = { workspace = true }
utilitycss-compiler = { version = "0.1.0", path = "../../vendor/tailwind-rs/crates/utilitycss-compiler" }
utilitycss-span = { version = "0.1.0", path = "../../vendor/tailwind-rs/crates/utilitycss-span" }
utilitycss-theme = { version = "0.1.0", path = "../../vendor/tailwind-rs/crates/utilitycss-theme" }
walkdir = { workspace = true }

[dev-dependencies]
ferrite-config = { workspace = true }
ferrite-graph = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
