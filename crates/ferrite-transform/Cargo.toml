[package]
name = "ferrite-transform"
version = "0.1.0"
edition = "2021"
description = "Ferrite JS/TS compiler abstraction with Oxc backend"

[features]
swc = ["dep:swc_core", "dep:swc_sourcemap"]

[dependencies]
ferrite-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
swc_core = { workspace = true, optional = true }
swc_sourcemap = { workspace = true, optional = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
oxc_transformer = { workspace = true }
oxc_codegen = { workspace = true }
oxc_minifier = { workspace = true }
oxc_sourcemap = { workspace = true }
