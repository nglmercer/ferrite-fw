[package]
name = "ferrite-e2e"
version = "0.1.0"
edition = "2021"
description = "Ferrite end-to-end testing: Chromium-first browser automation in pure Rust (no Node required)"

[dependencies]
ferrite-core = { workspace = true }
ferrite-config = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
http-body-util = "0.1"
hyper = "1"
globset = { workspace = true }
image = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["cookies", "multipart"] }
cookie = "0.18"
cookie_store = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
futures = { workspace = true }
md-5 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
