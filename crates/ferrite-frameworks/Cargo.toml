[package]
name = "ferrite-frameworks"
version = "0.1.0"
edition = "2021"
description = "Ferrite framework plugins: React Refresh, Vue/Svelte SFC experiments"

[dependencies]
async-trait = { workspace = true }
ferrite-core = { workspace = true }
ferrite-config = { workspace = true }
ferrite-plugin = { workspace = true }
ferrite-resolver = { workspace = true }
ferrite-transform = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
ferrite-npm = { workspace = true }
flate2 = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
oxc_sourcemap = { workspace = true }
ferrite-runtime = { workspace = true, optional = true }

url = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[features]
rquickjs = ["ferrite-runtime/rquickjs"]
napi-vm = ["ferrite-runtime/napi-vm"]
