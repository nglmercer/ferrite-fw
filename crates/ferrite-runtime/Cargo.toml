[package]
name = "ferrite-runtime"
version = "0.1.0"
edition = "2021"
description = "Ferrite JS execution abstraction: runtimes, values, pools"

[dependencies]
ferrite-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
# Opt-in embedded JS + Node-API runtime. Pinned git rev; pure-Rust core only
# (no N-API build layer) plus the in-process Node-API addon host. Timer
# globals are selected explicitly from the matching runtime crate below.
napi-vm = { package = "napi-vm-core", git = "https://github.com/nglmercer/napi-vm", rev = "7362971e7781c0c57b36c5a11813fff0e6bc3521", default-features = false, features = ["node-api-host"], optional = true }

# Explicit timer/microtask host APIs moved out of the interpreter core.
napi-vm-host = { package = "napi-vm-runtime", git = "https://github.com/nglmercer/napi-vm", rev = "7362971e7781c0c57b36c5a11813fff0e6bc3521", default-features = false, optional = true }

[features]
default = []
# Disabled by default: embedded JS execution + in-process `.node` loading.
napi-vm = ["dep:napi-vm", "dep:napi-vm-host"]
